  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #35105f,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #60103c,
          transparent 35%
        ),
        #050507;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 14px 12px;

      background: rgba(5,5,8,.94);

      backdrop-filter: blur(12px);

      border-bottom:
        1px solid
        rgba(255,255,255,.08);
    }

    .header-inner {
      max-width: 900px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .logo {
      font-size: 21px;
      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ff1590,
          #8c5cff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .telegram {
      text-decoration: none;
      color: white;

      background: #168cff;

      padding: 10px 14px;

      border-radius: 25px;

      font-size: 13px;

      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 900px;

      margin: auto;

      padding:
        18px
        10px
        40px;
    }

    .ad-box {
      width: 100%;

      min-height: 60px;

      margin:
        10px
        0
        18px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }

    h1 {
      margin:
        5px
        0
        8px;

      font-size:
        clamp(
          22px,
          5vw,
          34px
        );
    }

    .info {
      color: #999;

      font-size: 13px;

      margin-bottom: 14px;
    }

    .video-wrapper {
      width: 100%;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.65);
    }

    video {
      display: block;

      width: 100%;

      height: auto;

      min-height: 200px;

      background: #000;
    }

    .like-button {
      margin-top: 12px;

      padding:
        10px
        16px;

      border: 0;

      border-radius: 10px;

      color: white;

      background:
        rgba(255,255,255,.08);

      cursor: pointer;

      font-size: 14px;
    }

    .like-button.active {
      background:
        linear-gradient(
          135deg,
          #ff1590,
          #8c5cff
        );
    }

    .description {
      margin-top: 18px;

      padding: 17px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid
        rgba(255,255,255,.08);

      color: #aaa;

      line-height: 1.6;
    }

    footer {
      text-align: center;

      padding:
        25px
        10px;

      color: #555;

      font-size: 12px;
    }

    @media(max-width:600px) {

      .logo {
        font-size: 18px;
      }

      .telegram {
        padding:
          9px
          11px;

        font-size: 12px;
      }

    }

  </style>

<body>


  <!-- HEADER -->

  <div class="header">

    <div class="header-inner">

      <div class="logo">
        VAIRAL VIDEO

      <a
        class="telegram"
        href="https://t.me/allvairallinkandvideo"

        rel="noopener noreferrer"
      >

        ✈️ Telegram

    </div>

  </div>



  <div class="container">


    <!-- TOP AD -->

    <div class="ad-box"></div>



    <!-- TITLE -->

    <h1 id="videoTitle">
      Premium Viral Video
    </h1>


    <div class="info">

      👁️
      <span id="views">0</span>
      Views

      &nbsp; • &nbsp;

      ❤️

      Likes

    </div>



    <!-- =================================================
         VIDEO PLAYER

         Video URL JavaScript দিয়ে বসবে।
    ================================================== -->

    <div class="video-wrapper">

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
      >

          type="video/mp4"
        >

        Your browser does not support HTML5 video.

      </video>

    </div>



    <!-- LIKE -->

    <button
      class="like-button"
      id="likeButton"

    <!-- DESCRIPTION -->

    <div class="description">

      <br><br>

      Watch the video and join our

      </strong>

  <script>

    /* =================================================
       VIDEO LIST

       ভিডিও ১
       video-10.mp4

       ভিডিও ২
       video-9.mp4

       ভবিষ্যতে নতুন ভিডিও এভাবে যোগ করবেন:

       ,
       "https://.../video-8.mp4"

    ================================================== */

    const VIDEOS = [

      "https://mshoftgubfbkvynndtnu.supabase.co/storage/v1/object/public/Video/video-10.mp4"
      "https://mshoftgubfbkvynndtnu.supabase.co/storage/v1/object/public/Video/video-9.mp4"
     "https://mshoftgubfbkvynndtnu.supabase.co/storage/v1/object/public/Video/video-8.mp4"
     "https://mshoftgubfbkvynndtnu.supabase.co/storage/v1/object/public/Video/video-7.mp4"
     " https://mshoftgubfbkvynndtnu.supabase.co/storage/v1/object/public/Video/video-6.mp4"
     " https://mshoftgubfbkvynndtnu.supabase.co/storage/v1/object/public/Video/video-5.mp4"

    
    ];
  

    /* =================================================
       SELECT VIDEO
    ================================================== */

    const VIDEO_INDEX_KEY =
      "vairal_video_index";


    let currentIndex =
      parseInt(
        localStorage.getItem(
          VIDEO_INDEX_KEY
        ),
        10
      );


    /* প্রথমবার হলে 0 */

    if (
      Number.isNaN(currentIndex) ||
      currentIndex < 0 ||
      currentIndex >= VIDEOS.length
    ) {

      currentIndex = 0;

    }


    /* =================================================
       VIDEO PLAYER
    ================================================== */

    const videoPlayer =
      document.getElementById(
        "videoPlayer"
      );


    const videoSource =
      document.getElementById(
        "videoSource"
      );


    /* নির্বাচিত ভিডিও বসানো */

    videoSource.src =
      VIDEOS[currentIndex];


    /* Browser-কে ভিডিও load করতে বলা */

    videoPlayer.load();



    /* =================================================
       TITLE
    ================================================== */

    document.getElementById(
      "videoTitle"
    ).textContent =

      "Premium Viral Video #" +
      (currentIndex + 1);



    /* =================================================
       NEXT VIDEO INDEX SAVE

       এবার video-9 হবে।
       পরেরবার আবার video-10 হবে।

       অর্থাৎ:

       Visit 1 → video-10
       Visit 2 → video-9
       Visit 3 → video-10
       Visit 4 → video-9

    ================================================== */

    const nextIndex =
      (currentIndex + 1) % VIDEOS.length;


    localStorage.setItem(
      VIDEO_INDEX_KEY,
      nextIndex
    );



    /* =================================================
       VIEW COUNTER
    ================================================== */

    let views =
      Number(
        localStorage.getItem(
          "vairal_views"
        )
      ) || 0;


    views++;


    localStorage.setItem(
      "vairal_views",
      views
    );


    document.getElementById(
      "views"
    ).textContent = views;



    /* =================================================
       LIKE SYSTEM
    ================================================== */

    let likes =
      Number(
        localStorage.getItem(
          "vairal_likes"
        )
      ) || 0;


    let liked =
      localStorage.getItem(
        "vairal_liked"
      ) === "true";


    const likeButton =
      document.getElementById(
        "likeButton"
      );


    document.getElementById(
      "likes"
    ).textContent = likes;


    if (liked) {

      likeButton.classList.add(
        "active"
      );

      likeButton.textContent =
        "❤️ Liked";

    }


    likeButton.addEventListener(
      "click",
      function() {

        if (!liked) {

          likes++;

          liked = true;

          likeButton.classList.add(
            "active"
          );

          likeButton.textContent =
            "❤️ Liked";

        }

        else {

          likes =
            Math.max(
              0,
              likes - 1
            );

          liked = false;

          likeButton.classList.remove(
            "active"
          );

          likeButton.textContent =
            "❤️ Like";

        }


        localStorage.setItem(
          "vairal_likes",
          likes
        );


        localStorage.setItem(
          "vairal_liked",
          liked
        );


        document.getElementById(
          "likes"
        ).textContent = likes;

      }

    );

  </script>


</body>
