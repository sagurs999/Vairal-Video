<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Premium Video Player</title>

<style>

body{

margin:0;

padding:20px;

font-family:Arial;

background:
linear-gradient(135deg,
#141e30,
#243b55,
#2c5364);

}

.container{

max-width:900px;

margin:auto;

}

.telegram{

display:block;

padding:18px;

margin-bottom:20px;

text-align:center;

text-decoration:none;

font-size:24px;

font-weight:bold;

color:white;

border-radius:20px;

background:
linear-gradient(
90deg,
#0088cc,
#00c6ff);

}

.ad-top,
.ad-bottom{

background:white;

padding:20px;

border-radius:20px;

margin-bottom:20px;

min-height:100px;

}

.player{

position:relative;

overflow:hidden;

border-radius:25px;

}

video{

width:100%;

border-radius:25px;

}

.overlay-ad{

display:none;

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

width:85%;

background:white;

padding:20px;

border-radius:15px;

z-index:100;

}

.end-ad{

display:none;

margin-top:20px;

background:white;

padding:20px;

border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<a class="telegram"
href="https://t.me/yourchannel">

🚀 JOIN TELEGRAM CHANNEL

</a>

<div class="ad-top">

YOUR_TOP_AD_CODE

</div>

<div class="player">

<video
id="video"
controls>

<source
src="YOUR_VIDEO_LINK.mp4"
type="video/mp4">

</video>

<div
class="overlay-ad"
id="middleAd">

YOUR_MIDDLE_AD_CODE

</div>

</div>

<div
class="end-ad"
id="endAd">

YOUR_END_AD_CODE

</div>

</div>

<script>

const video=
document.getElementById(
"video");

const middleAd=
document.getElementById(
"middleAd");

const endAd=
document.getElementById(
"endAd");

video.addEventListener(
"timeupdate",

function(){

if(
video.duration>0&&
video.currentTime>
video.duration/2){

middleAd.style.display=
"block";

}

});

video.addEventListener(
"ended",

function(){

endAd.style.display=
"block";

});

</script>

</body>

</html>
