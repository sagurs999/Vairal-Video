    .logo {

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .telegram {
      text-decoration: none;
      color: white;

      background:
        linear-gradient(135deg,#168cff,#006dcc);

      padding: 10px 15px;

    main {
      width: 100%;
      max-width: 950px;

      margin: auto;

      padding: 20px 12px 50px;
    }

    /* =========================
       AD AREA
    ========================== */

    .ad-area {
      width: 100%;
      min-height: 80px;

      margin: 10px 0 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 12px;
    }

    /* =========================
       TITLE
    ========================== */

    .title {
      font-size: clamp(24px,5vw,38px);

      font-weight: 900;

      margin-bottom: 10px;
    }

    .meta {
      color: #999;
      font-size: 14px;

      margin-bottom: 15px;
    }

    /* =========================
       VIDEO PLAYER
    ========================== */

    .video-box {
      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        0 0 40px rgba(130,0,255,.08);
    }

    .video-box iframe {
      width: 100%;
      height: 100%;

      display: block;

      border: 0;
    }

    /* =========================
       LIKE BUTTON
    ========================== */

    .buttons {
      display: flex;

      gap: 10px;

      margin-top: 14px;
    }

    .control-btn {
      border: 0;

      color: #fff;

      background:
        rgba(255,255,255,.08);

      padding: 11px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;

      transition: .2s;
    }

    .control-btn:hover {
      background:
        rgba(255,255,255,.17);
    }

    .control-btn:active {
      transform: scale(.96);
    }

    .liked {
      background:
        linear-gradient(
          135deg,
          #ff1590,
          #8c5cff
        );
    }

    /* =========================
       DESCRIPTION
    ========================== */

    .description {
      margin-top: 20px;

      padding: 18px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.08);

      color: #aaa;

      line-height: 1.6;
    }

    footer {
      text-align: center;

      color: #555;

      padding: 30px 10px;

      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .logo {

      }

        font-size: 12px;
      }

      main {
        padding: 15px 8px 40px;
      }

      .video-box {
        border-radius: 12px;
      }

    }
  </style>

  <script>

    /* ==========================================
       VIEW COUNTER
    ========================================== */

    let views =
      Number(
        localStorage.getItem("vairal_views")
      ) || 0;

    views++;

    localStorage.setItem(
      "vairal_views",
      views
    );

    document.getElementById(
      "views"
    ).textContent = views;



    /* ==========================================
       LIKE SYSTEM
    ========================================== */

    let likes =
      Number(
        localStorage.getItem("vairal_likes")
      ) || 0;

    let liked =
      localStorage.getItem(
        "vairal_liked"
      ) === "true";


    const likeBtn =
      document.getElementById(
        "likeBtn"
      );


    document.getElementById(
      "likes"
    ).textContent = likes;


    if (liked) {

      likeBtn.textContent =
        "❤️ Liked";

      likeBtn.classList.add(
        "liked"
      );

    }


    likeBtn.addEventListener(
      "click",
      function () {

        if (!liked) {

          likes++;

          liked = true;

          likeBtn.textContent =
            "❤️ Liked";

          likeBtn.classList.add(
            "liked"
          );

        } else {

          likes =
            Math.max(
              0,
              likes - 1
            );

          liked = false;

          likeBtn.textContent =
            "❤️ Like";

          likeBtn.classList.remove(
            "liked"
          );

        }


        localStorage.setItem(
          "vairal_likes",
          likes
        );

        localStorage.setItem(
          "vairal_liked",
          liked
        );


        document.getElementById(
          "likes"
        ).textContent = likes;

      }
    );


    /* ==========================================
       BASIC RIGHT-CLICK PROTECTION
    ========================================== */

    document.addEventListener(
      "contextmenu",
      function(event) {
        event.preventDefault();
      }
    );

  </script>
