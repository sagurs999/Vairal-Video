    /* =========================
       HEADER
    ========================== */

    .header {

      position: sticky;

      top: 0;

      z-index: 100;

      padding:

        12px;

      background:

      backdrop-filter:

      border-bottom:

    .header-inner {

      margin: auto;

      justify-content:

      gap: 10px;

    .logo {

      font-size: 21px;

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ff1590,
          #8c5cff
        );

      -webkit-background-clip:
        text;

      background-clip: text;

      color: transparent;

    }


    .telegram {

      text-decoration: none;

      color: white;

      background:
        #168cff;

      padding:
        10px
        14px;

      border-radius: 25px;

      font-size: 13px;

      font-weight: bold;

    }


    /* =========================
       MAIN
    ========================== */

    .container {

      width: 100%;

      max-width: 900px;

      margin: auto;

      padding:
        18px
        10px
        40px;

    }


    /* =========================
       AD AREA
    ========================== */

    .ad-box {

      width: 100%;

      min-height: 60px;

      margin:
        10px
        0
        18px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

    }


    /* =========================
       TITLE
    ========================== */

    h1 {

      margin:
        5px
        0
        8px;

      font-size:
        clamp(
          22px,
          5vw,
          34px
        );

    }


    .info {

      color: #999;

      font-size: 13px;

      margin-bottom: 14px;

    }


    /* =========================
       VIDEO
    ========================== */

    .video-wrapper {

      width: 100%;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.65);

    }


    video {

      display: block;

      width: 100%;

      height: auto;

      min-height: 200px;

      background: #000;

    }


    /* =========================
       LIKE
    ========================== */

    .like-button {

      margin-top: 12px;

      padding:
        10px
        16px;

      border: 0;

      border-radius: 10px;

      color: white;

      background:
        rgba(255,255,255,.08);

      cursor: pointer;

      font-size: 14px;

    }


    .like-button.active {

      background:
        linear-gradient(
          135deg,
          #ff1590,
          #8c5cff
        );

    }


    /* =========================
       DESCRIPTION
    ========================== */

    .description {

      margin-top: 18px;

      padding: 17px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid
        rgba(255,255,255,.08);

      color: #aaa;

      line-height: 1.6;

    }


    /* =========================
       FOOTER
    ========================== */

    footer {

      text-align: center;

      padding:
        25px
        10px;

      color: #555;

      font-size: 12px;

    }


    /* =========================
       MOBILE
    ========================== */

    @media(max-width:600px) {

      .logo {
        font-size: 18px;
      }

      .telegram {

        padding:
          9px
          11px;

        font-size: 12px;

  </style>

  <script>


    /* ================================================
       VIEW COUNTER
    ================================================= */


    let views =

      Number(
        localStorage.getItem(
          "vairal_views"
        )
      ) || 0;


    views++;


    localStorage.setItem(
      "vairal_views",
      views
    );


    document.getElementById(
      "views"
    ).textContent = views;



    /* ================================================
       LIKE SYSTEM
    ================================================= */


    let likes =

      Number(
        localStorage.getItem(
          "vairal_likes"
        )
      ) || 0;


    let liked =

      localStorage.getItem(
        "vairal_liked"
      ) === "true";


    const likeButton =

      document.getElementById(
        "likeButton"
      );


    document.getElementById(
      "likes"
    ).textContent = likes;


    if (liked) {

      likeButton.classList.add(
        "active"
      );

      likeButton.textContent =
        "❤️ Liked";

    }


    likeButton.addEventListener(

      "click",

      function() {


        if (!liked) {

          likes++;

          liked = true;

          likeButton.classList.add(
            "active"
          );

          likeButton.textContent =
            "❤️ Liked";

        }


        else {

          likes =
            Math.max(
              0,
              likes - 1
            );

          liked = false;

          likeButton.classList.remove(
            "active"
          );

          likeButton.textContent =
            "❤️ Like";

        }


        localStorage.setItem(
          "vairal_likes",
          likes
        );


        localStorage.setItem(
          "vairal_liked",
          liked
        );


        document.getElementById(
          "likes"
        ).textContent = likes;

      }

    );

  </script>
