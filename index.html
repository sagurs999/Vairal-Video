<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vairal Video</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at top left,
          #35105f,
          transparent 35%
        ),

        radial-gradient(
          circle at bottom right,
          #60103c,
          transparent 35%
        ),

        #050507;

    }


    header {

      position: sticky;

      top: 0;

      z-index: 1000;

      padding: 14px 16px;

      background:
        rgba(5,5,8,.92);

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

    }


    .header {

      max-width: 950px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

    }


    .logo {

      font-size: 22px;

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ff1590,
          #8c5cff
        );

      -webkit-background-clip:
        text;

      background-clip: text;

      color: transparent;

    }


    .telegram {

      text-decoration: none;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #168cff,
          #006dcc
        );

      padding: 10px 15px;

      border-radius: 30px;

      font-size: 14px;

      font-weight: bold;

    }


    main {

      width: 100%;

      max-width: 950px;

      margin: auto;

      padding:
        20px
        12px
        50px;

    }


    /* =========================
       AD AREA
    ========================== */

    .ad-area {

      width: 100%;

      min-height: 80px;

      margin:
        10px
        0
        20px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      border-radius: 12px;

    }


    /* =========================
       TITLE
    ========================== */

    .title {

      font-size:
        clamp(
          24px,
          5vw,
          38px
        );

      font-weight: 900;

      margin-bottom: 10px;

    }


    .meta {

      color: #999;

      font-size: 14px;

      margin-bottom: 15px;

    }


    /* =========================
       VIDEO PLAYER
    ========================== */

    .video-box {

      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.6);

    }


    #videoPlayer {

      width: 100%;

      height: 100%;

      display: block;

      background: #000;

      object-fit: contain;

    }


    /* =========================
       BUTTONS
    ========================== */

    .buttons {

      display: flex;

      gap: 10px;

      margin-top: 14px;

    }


    .control-btn {

      border: 0;

      color: #fff;

      background:
        rgba(255,255,255,.08);

      padding:
        11px
        16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;

      transition: .2s;

    }


    .control-btn:hover {

      background:
        rgba(255,255,255,.17);

    }


    .control-btn:active {

      transform:
        scale(.96);

    }


    .liked {

      background:
        linear-gradient(
          135deg,
          #ff1590,
          #8c5cff
        );

    }


    /* =========================
       DESCRIPTION
    ========================== */

    .description {

      margin-top: 20px;

      padding: 18px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid
        rgba(255,255,255,.08);

      color: #aaa;

      line-height: 1.6;

    }


    footer {

      text-align: center;

      color: #555;

      padding: 30px 10px;

      font-size: 12px;

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .logo {

        font-size: 19px;

      }


      .telegram {

        padding:
          9px
          12px;

        font-size: 12px;

      }


      main {

        padding:
          15px
          8px
          40px;

      }


      .video-box {

        border-radius: 12px;

      }

    }

  </style>
