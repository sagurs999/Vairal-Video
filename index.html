<script>

/* =========================================================
   BACKENDLESS CONFIG
========================================================= */


/*
 * APPLICATION ID
 */

const BACKENDLESS_APP_ID =
    "B73D967B-B1CA-42B7-98B1-34969A1A096D";


/*
 * REST API KEY
 */

const BACKENDLESS_API_KEY =
    "C59C4813-C974-4B43-ACBE-313ABCB461B7";


/*
 * BACKENDLESS BASE URL
 */

const BACKENDLESS_BASE_URL =
    "https://api.backendless.com/" +
    BACKENDLESS_APP_ID +
    "/" +
    BACKENDLESS_API_KEY;


/*
 * VIDEOS TABLE
 */

const VIDEOS_API =
    BACKENDLESS_BASE_URL +
    "/data/bulk/Videos";



/* =========================================================
   ELEMENTS
========================================================= */

const videoArea =
    document.getElementById(
        "videoArea"
    );

const loading =
    document.getElementById(
        "loading"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const videoName =
    document.getElementById(
        "videoName"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const likeBtn =
    document.getElementById(
        "likeBtn"
    );

const likeCount =
    document.getElementById(
        "likeCount"
    );

const viewCount =
    document.getElementById(
        "viewCount"
    );



/* =========================================================
   LOCAL STORAGE
========================================================= */

const LAST_VIDEO_KEY =
    "vairal_last_video";

const VIEW_PREFIX =
    "vairal_view_";

const LIKE_PREFIX =
    "vairal_like_";



/* =========================================================
   GLOBAL
========================================================= */

let videos = [];

let currentIndex = 0;

let currentVimeoPlayer = null;

let changingVideo = false;



/* =========================================================
   LOAD VIDEOS FROM BACKENDLESS
========================================================= */

async function getAllVideos(){

    try{


        loading.style.display =
            "block";


        loading.innerHTML =
            "⏳ Loading videos from server...";


        errorBox.style.display =
            "none";


        videoArea.style.display =
            "none";


        nextBtn.style.display =
            "none";


        console.log(
            "Backendless API:",
            VIDEOS_API
        );


        const response =
            await fetch(
                VIDEOS_API,
                {
                    method:"GET",

                    headers:{
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        console.log(
            "Backendless status:",
            response.status
        );


        if(!response.ok){

            let message =
                "Backendless Error: " +
                response.status;


            try{

                const data =
                    await response.json();


                console.error(
                    "Backendless error:",
                    data
                );


                if(data.message){

                    message +=
                        " - " +
                        data.message;

                }

            }catch(e){}


            throw new Error(
                message
            );

        }


        const data =
            await response.json();


        console.log(
            "Backendless response:",
            data
        );


        /*
         * Backendless data array
         */

        if(Array.isArray(data)){

            videos =
                data;

        }

        else if(
            data &&
            Array.isArray(data.data)
        ){

            videos =
                data.data;

        }

        else if(
            data &&
            Array.isArray(data.result)
        ){

            videos =
                data.result;

        }

        else{

            videos =
                [];

        }


        /*
         * Remove invalid rows
         */

        videos =
            videos.filter(
                video => {

                    return (
                        video &&
                        (
                            video.videoId ||
                            video.videoUrl
                        )
                    );

                }
            );


        console.log(
            "VIDEOS FOUND:",
            videos.length
        );


        if(videos.length === 0){

            throw new Error(
                "Videos table-এ কোনো ভিডিও পাওয়া যায়নি।"
            );

        }


        /*
         * Newest first
         */

        videos.sort(
            (a,b) => {

                const dateA =
                    new Date(
                        a.created ||
                        0
                    ).getTime();


                const dateB =
                    new Date(
                        b.created ||
                        0
                    ).getTime();


                return dateB - dateA;

            }
        );


        /*
         * Previous video
         */

        const lastVideo =
            localStorage.getItem(
                LAST_VIDEO_KEY
            );


        if(lastVideo){

            const index =
                videos.findIndex(
                    video =>
                        String(
                            video.objectId
                        ) ===
                        String(
                            lastVideo
                        )
                );


            if(index >= 0){

                currentIndex =
                    (
                        index + 1
                    ) %
                    videos.length;

            }

            else{

                currentIndex = 0;

            }

        }

        else{

            currentIndex = 0;

        }


        loadVideo(
            currentIndex
        );


    }

    catch(error){

        console.error(
            "VIDEO LOAD ERROR:",
            error
        );


        showError(
            error.message
        );

    }

}



/* =========================================================
   GET VIMEO VIDEO ID
========================================================= */

function getVimeoId(video){


    /*
     * videoId exists
     */

    if(
        video.videoId &&
        String(
            video.videoId
        ).trim() !== ""
    ){

        return String(
            video.videoId
        ).trim();

    }


    /*
     * Extract from URL
     */

    if(
        video.videoUrl
    ){

        const url =
            String(
                video.videoUrl
            );


        const match =
            url.match(
                /vimeo\.com\/(?:video\/)?(\d+)/
            );


        if(match){

            return match[1];

        }

    }


    return null;

}



/* =========================================================
   IS VIMEO
========================================================= */

function isVimeoVideo(video){

    const url =
        String(
            video.videoUrl ||
            ""
        ).toLowerCase();


    return (
        url.includes(
            "vimeo.com"
        ) ||
        !!getVimeoId(video)
    );

}



/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(index){


    if(!videos.length){

        return;

    }


    /*
     * Loop
     */

    if(
        index >=
        videos.length
    ){

        index = 0;

    }


    if(index < 0){

        index =
            videos.length - 1;

    }


    currentIndex =
        index;


    const video =
        videos[
            currentIndex
        ];


    console.log(
        "CURRENT VIDEO:",
        video
    );


    /*
     * Save current video
     */

    if(video.objectId){

        localStorage.setItem(
            LAST_VIDEO_KEY,
            video.objectId
        );

    }


    /*
     * Title
     */

    videoName.textContent =
        video.title ||
        "Vairal Video";


    /*
     * Counters
     */

    updateViewCount(
        video
    );


    updateLikeCount(
        video
    );


    /*
     * Reset
     */

    destroyCurrentPlayer();


    loading.style.display =
        "block";


    loading.innerHTML =
        "⏳ Loading video...";


    errorBox.style.display =
        "none";


    videoArea.style.display =
        "none";


    nextBtn.style.display =
        "block";


    /*
     * Vimeo
     */

    if(
        isVimeoVideo(video)
    ){

        loadVimeoVideo(
            video
        );

    }

    else{

        loadNormalVideo(
            video
        );

    }

}



/* =========================================================
   VIMEO PLAYER
========================================================= */

function loadVimeoVideo(video){


    const vimeoId =
        getVimeoId(
            video
        );


    if(!vimeoId){

        showError(
            "Vimeo Video ID পাওয়া যায়নি।"
        );

        return;

    }


    /*
     * Create iframe
     */

    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.id =
        "vimeoPlayer";


    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture"
    );


    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    iframe.frameBorder =
        "0";


    iframe.src =
        "https://player.vimeo.com/video/" +
        encodeURIComponent(
            vimeoId
        ) +
        "?title=0&byline=0&portrait=0";


    videoArea.innerHTML =
        "";


    videoArea.appendChild(
        iframe
    );


    videoArea.style.display =
        "block";


    /*
     * Vimeo SDK
     */

    try{

        currentVimeoPlayer =
            new Vimeo.Player(
                iframe
            );


        /*
         * Loaded
         */

        currentVimeoPlayer.on(
            "loaded",
            function(){

                loading.style.display =
                    "none";

            }
        );


        /*
         * Play
         */

        currentVimeoPlayer.on(
            "play",
            function(){

                loading.style.display =
                    "none";

            }
        );


        /*
         * Ended
         */

        currentVimeoPlayer.on(
            "ended",
            function(){

                if(
                    changingVideo
                ){

                    return;

                }


                console.log(
                    "VIDEO ENDED"
                );


                goToNextVideo();

            }
        );


        /*
         * Error
         */

        currentVimeoPlayer.on(
            "error",
            function(data){

                console.error(
                    "VIMEO ERROR:",
                    data
                );


                showError(
                    "এই Vimeo ভিডিওটি embed করা যাচ্ছে না। Vimeo Privacy/Embed Settings চেক করুন।"
                );

            }
        );


    }

    catch(error){

        console.error(
            "Vimeo Player Error:",
            error
        );


        showError(
            "Vimeo Player চালু করা যাচ্ছে না।"
        );

    }

}



/* =========================================================
   NORMAL MP4 VIDEO
========================================================= */

function loadNormalVideo(video){


    if(
        !video.videoUrl
    ){

        showError(
            "এই ভিডিওর videoUrl নেই।"
        );

        return;

    }


    const player =
        document.createElement(
            "video"
        );


    player.controls =
        true;


    player.playsInline =
        true;


    player.preload =
        "metadata";


    player.src =
        String(
            video.videoUrl
        );


    videoArea.innerHTML =
        "";


    videoArea.appendChild(
        player
    );


    videoArea.style.display =
        "block";


    player.addEventListener(
        "loadeddata",
        function(){

            loading.style.display =
                "none";

        }
    );


    player.addEventListener(
        "ended",
        function(){

            goToNextVideo();

        }
    );


    player.addEventListener(
        "error",
        function(){

            showError(
                "এই ভিডিওটি চালানো যাচ্ছে না।"
            );

        }
    );

}



/* =========================================================
   DESTROY PLAYER
========================================================= */

function destroyCurrentPlayer(){

    changingVideo =
        true;


    if(
        currentVimeoPlayer
    ){

        try{

            currentVimeoPlayer.unload();

        }

        catch(e){

            console.log(e);

        }


        currentVimeoPlayer =
            null;

    }


    videoArea.innerHTML =
        "";


    changingVideo =
        false;

}



/* =========================================================
   NEXT VIDEO
========================================================= */

function goToNextVideo(){

    if(
        !videos.length
    ){

        return;

    }


    const nextIndex =
        (
            currentIndex +
            1
        ) %
        videos.length;


    loadVideo(
        nextIndex
    );

}



/* =========================================================
   NEXT BUTTON
========================================================= */

nextBtn.addEventListener(
    "click",
    function(){

        goToNextVideo();

    }
);



/* =========================================================
   ERROR
========================================================= */

function showError(message){

    loading.style.display =
        "none";


    videoArea.style.display =
        "none";


    errorBox.style.display =
        "block";


    errorBox.innerHTML =
        "❌ " +
        message +
        "<br><br>" +
        "<small>" +
        "Backendless Videos table এবং Vimeo settings চেক করুন।" +
        "</small>";


    if(videos.length){

        nextBtn.style.display =
            "block";

    }

}



/* =========================================================
   VIEW COUNTER
========================================================= */

function updateViewCount(video){

    const id =
        video.objectId ||
        video.videoId ||
        video.videoUrl;


    const key =
        VIEW_PREFIX +
        id;


    let count =
        parseInt(
            localStorage.getItem(
                key
            ) || "0",
            10
        );


    const viewedKey =
        key +
        "_done";


    /*
     * Count once per browser
     */

    if(
        !localStorage.getItem(
            viewedKey
        )
    ){

        count++;


        localStorage.setItem(
            key,
            count
        );


        localStorage.setItem(
            viewedKey,
            "1"
        );

    }


    /*
     * Backendless value
     */

    const backendViews =
        parseInt(
            video.views || "0",
            10
        );


    const finalCount =
        Math.max(
            count,
            backendViews
        );


    viewCount.textContent =
        finalCount;

}



/* =========================================================
   LIKE COUNTER
========================================================= */

function updateLikeCount(video){

    const id =
        video.objectId ||
        video.videoId ||
        video.videoUrl;


    const key =
        LIKE_PREFIX +
        id;


    const localCount =
        parseInt(
            localStorage.getItem(
                key
            ) || "0",
            10
        );


    const backendLikes =
        parseInt(
            video.likes || "0",
            10
        );


    const finalCount =
        Math.max(
            localCount,
            backendLikes
        );


    likeCount.textContent =
        finalCount;


    const likedKey =
        key +
        "_clicked";


    if(
        localStorage.getItem(
            likedKey
        )
    ){

        likeBtn.classList.add(
            "liked"
        );

    }

    else{

        likeBtn.classList.remove(
            "liked"
        );

    }

}



/* =========================================================
   LIKE BUTTON
========================================================= */

likeBtn.addEventListener(
    "click",
    function(){

        if(
            !videos.length
        ){

            return;

        }


        const video =
            videos[
                currentIndex
            ];


        const id =
            video.objectId ||
            video.videoId ||
            video.videoUrl;


        const key =
            LIKE_PREFIX +
            id;


        const likedKey =
            key +
            "_clicked";


        let count =
            parseInt(
                localStorage.getItem(
                    key
                ) || "0",
                10
            );


        /*
         * UNLIKE
         */

        if(
            localStorage.getItem(
                likedKey
            )
        ){

            count =
                Math.max(
                    0,
                    count - 1
                );


            localStorage.removeItem(
                likedKey
            );

        }


        /*
         * LIKE
         */

        else{

            count++;


            localStorage.setItem(
                likedKey,
                "1"
            );

        }


        localStorage.setItem(
            key,
            count
        );


        updateLikeCount(
            video
        );

    }
);



/* =========================================================
   START
========================================================= */

getAllVideos();

</script>
