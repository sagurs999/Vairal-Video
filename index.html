<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vairal Video</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #35105f,
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          #60103c,
          transparent 35%
        ),
        #050507;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 12px;

      background:
        rgba(5,5,8,.94);

      backdrop-filter:
        blur(12px);

      border-bottom:
        1px solid
        rgba(255,255,255,.08);
    }


    .header-inner {
      width: 100%;
      max-width: 900px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    .logo {
      font-size: 21px;
      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ff1590,
          #8c5cff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }


    /* ==========================================
       TELEGRAM LOGO ONLY
    ========================================== */

    .telegram-logo {
      width: 44px;
      height: 44px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #fff;

      background: #229ED9;

      border-radius: 50%;

      text-decoration: none;

      box-shadow:
        0 5px 20px
        rgba(34,158,217,.35);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    .telegram-logo:hover {
      transform: scale(1.08);

      box-shadow:
        0 7px 25px
        rgba(34,158,217,.5);
    }


    .telegram-logo:active {
      transform: scale(.95);
    }


    .telegram-logo svg {
      width: 27px;
      height: 27px;
    }


    /* ==========================================
       MAIN
    ========================================== */

    .container {
      width: 100%;
      max-width: 900px;

      margin: auto;

      padding:
        18px 10px 40px;
    }


    /* ==========================================
       ADS
    ========================================== */

    .ad-box {
      width: 100%;

      min-height: 60px;

      margin:
        10px 0 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* ==========================================
       TITLE
    ========================================== */

    h1 {
      margin:
        5px 0 8px;

      font-size:
        clamp(
          22px,
          5vw,
          34px
        );

      text-transform:
        capitalize;
    }


    .info {
      color: #999;

      font-size: 13px;

      margin-bottom: 14px;
    }


    /* ==========================================
       VIDEO
    ========================================== */

    .video-wrapper {
      width: 100%;

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.65);
    }


    video {
      display: block;

      width: 100%;

      height: auto;

      min-height: 200px;

      background: #000;
    }
