  <script>

    /* =================================================
       SUPABASE CONFIGURATION
    ================================================= */

    const SUPABASE_URL =
      "https://mshoftgubfbkvynndtnu.supabase.co";

    const SUPABASE_BUCKET =
      "Video";

    const SUPABASE_KEY =
      "sb_publishable_2L716MuF36gsDT5fGu_k9Q_LzGLqTk0";


    /* =================================================
       ELEMENTS
    ================================================= */

    const videoPlayer =
      document.getElementById("videoPlayer");

    const videoSource =
      document.getElementById("videoSource");

    const videoStatus =
      document.getElementById("videoStatus");

    const videoTitle =
      document.getElementById("videoTitle");


    /* =================================================
       LOAD VIDEOS AUTOMATICALLY
       
       Supabase Video bucket থেকে MP4 files নেওয়া হবে।
    ================================================= */

    async function loadVideos() {

      try {

        videoStatus.textContent =
          "Loading video...";


        const response = await fetch(

          SUPABASE_URL +
          "/storage/v1/object/list/" +
          SUPABASE_BUCKET,

          {
            method: "POST",

            headers: {

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              prefix: "",

              limit: 1000,

              offset: 0,

              sortBy: {
                column: "name",
                order: "desc"
              }

            })

          }

        );


        if (!response.ok) {

          throw new Error(
            "Supabase file list failed: " +
            response.status
          );

        }


        const files =
          await response.json();


        /* শুধু MP4 ভিডিও */

        const videos =
          files.filter(file => {

            return (
              file.name &&
              file.name
                .toLowerCase()
                .endsWith(".mp4")
            );

          });


        if (!videos.length) {

          throw new Error(
            "No MP4 videos found in Video bucket."
          );

        }


        /* =================================================
           VIDEO SELECTION

           প্রতিবার page open হলে পরের ভিডিও।
        ================================================= */

        const STORAGE_KEY =
          "vairal_auto_video_index";


        let index =
          parseInt(
            localStorage.getItem(
              STORAGE_KEY
            ),
            10
          );


        if (
          Number.isNaN(index) ||
          index < 0 ||
          index >= videos.length
        ) {

          index = 0;

        }


        const selectedVideo =
          videos[index];


        /* পরেরবার পরের ভিডিও */

        const nextIndex =
          (index + 1) %
          videos.length;


        localStorage.setItem(
          STORAGE_KEY,
          nextIndex
        );


        /* =================================================
           PUBLIC VIDEO URL
        ================================================= */

        const videoURL =
          SUPABASE_URL +
          "/storage/v1/object/public/" +
          SUPABASE_BUCKET +
          "/" +
          encodeURIComponent(
            selectedVideo.name
          );


        /* =================================================
           SET VIDEO
        ================================================= */

        videoSource.src =
          videoURL;

        videoPlayer.load();


        videoPlayer.style.display =
          "block";

        videoStatus.style.display =
          "none";


        videoTitle.textContent =
          selectedVideo.name
            .replace(".mp4", "")
            .replace(/[-_]/g, " ");


      }

      catch (error) {

        console.error(
          "Video loading error:",
          error
        );


        videoPlayer.style.display =
          "none";


        videoStatus.style.display =
          "block";


        videoStatus.textContent =
          "ভিডিও লোড করা যাচ্ছে না। Supabase Storage permission পরীক্ষা করুন।";

      }

    }


    /* শুরু */

    loadVideos();



    /* =================================================
       VIEW COUNTER
    ================================================= */

    let views =
      Number(
        localStorage.getItem(
          "vairal_views"
        )
      ) || 0;


    views++;


    localStorage.setItem(
      "vairal_views",
      views
    );


    document.getElementById(
      "views"
    ).textContent =
      views;



    /* =================================================
       LIKE SYSTEM
    ================================================= */

    let likes =
      Number(
        localStorage.getItem(
          "vairal_likes"
        )
      ) || 0;


    let liked =
      localStorage.getItem(
        "vairal_liked"
      ) === "true";


    const likeButton =
      document.getElementById(
        "likeButton"
      );


    document.getElementById(
      "likes"
    ).textContent =
      likes;


    if (liked) {

      likeButton.classList.add(
        "active"
      );

      likeButton.textContent =
        "❤️ Liked";

    }


    likeButton.addEventListener(
      "click",
      function() {

        if (!liked) {

          likes++;

          liked = true;

          likeButton.classList.add(
            "active"
          );

          likeButton.textContent =
            "❤️ Liked";

        }

        else {

          likes =
            Math.max(
              0,
              likes - 1
            );

          liked = false;

          likeButton.classList.remove(
            "active"
          );

          likeButton.textContent =
            "❤️ Like";

        }


        localStorage.setItem(
          "vairal_likes",
          likes
        );


        localStorage.setItem(
          "vairal_liked",
          liked
        );


        document.getElementById(
          "likes"
        ).textContent =
          likes;

      }

    );

  </script>
