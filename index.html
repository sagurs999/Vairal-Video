  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #35105f, transparent 35%),
        radial-gradient(circle at bottom right, #60103c, transparent 35%),

    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 30% 40%,
          rgba(255,0,120,.08),
          transparent 25%

        radial-gradient(
          circle at 70% 70%,
          rgba(80,0,255,.08),
          transparent 25%
        );

      animation: backgroundMove 8s ease-in-out infinite alternate;
    }

    @keyframes backgroundMove {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.15);
      }
    }

    /* ================================
       HEADER
    ================================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      padding: 14px 16px;

      background: rgba(5,5,8,.9);

      backdrop-filter: blur(12px);

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }

    .header {
      max-width: 950px;
      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;
    }

    .logo {
      font-size: 23px;

      font-weight: 900;

      background:

          90deg,
          #ff1590,
          #8c5cff
        );

      background-clip: text;

    }

    .telegram {
      display: inline-block;

      text-decoration: none;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #168cff,
          #006dcc
        );

      padding: 10px 15px;

      border-radius: 30px;

      font-weight: 700;

      font-size: 14px;

      transition: .2s;
    }

    .telegram:active {
      transform: scale(.95);
    }


    /* ================================
       MAIN
    ================================= */

    main {
      width: 100%;

      max-width: 950px;

      margin: auto;

      padding: 20px 12px 50px;
    }


    /* ================================
       AD AREA
    ================================= */

    .ad-area {
      width: 100%;

      min-height: 80px;

      margin: 10px 0 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      border-radius: 12px;
    }


    /* ================================
       VIDEO TITLE
    ================================= */

    .title {
      font-size:
        clamp(
          24px,
          5vw,
          38px
        );

      font-weight: 900;

      line-height: 1.15;

      margin-bottom: 10px;
    }

    .meta {
      color: #999;

      font-size: 14px;

      margin-bottom: 15px;
    }


    /* ================================
       VIDEO
    ================================= */

    .video-box {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        0 0 40px rgba(130,0,255,.08);
    }

    .video-box iframe {
      width: 100%;

      height: 100%;

      display: block;

      border: 0;

      background: #000;
    }


    /* ================================
       BUTTONS
    ================================= */

    .buttons {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 14px;
    }

    .control-btn {
      border: 0;

      color: #fff;

      background:
        rgba(255,255,255,.08);

      padding: 11px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;

      transition: .2s;
    }

    .control-btn:hover {
      background:
        rgba(255,255,255,.17);
    }

    .control-btn:active {
      transform: scale(.96);
    }

    .liked {
      background:
        linear-gradient(
          135deg,
          #ff1590,
          #8c5cff
        );
    }


    /* ================================
       DESCRIPTION
    ================================= */

    .description {
      margin-top: 20px;

      padding: 18px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.08);

      color: #aaa;

      line-height: 1.6;
    }


    /* ================================
       FOOTER
    ================================= */

    footer {
      text-align: center;

      color: #555;

      padding: 30px 10px;

      font-size: 12px;
    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .logo {
        font-size: 19px;
      }

      .telegram {
        padding: 9px 12px;

        font-size: 12px;
      }

      main {
        padding:
          15px
          8px
          40px;
      }

      .video-box {
        border-radius: 12px;
      }

      .control-btn {
        padding:
          10px
          12px;
      }

    }

  </style>

  <script>


    /* =====================================================
       VIDEO LIST

       এখানে যতগুলো Videy video আছে সবগুলো লিখবেন।

       গুরুত্বপূর্ণ:
       নতুন ভিডিও যোগ করতে শুধু নতুন লাইনে
       Videy link বসাবেন।
    ====================================================== */


    const VIDEOS = [

      "https://videy.co/v/?id=RACMTe6R1",

      // নতুন ভিডিও এখানে যোগ করুন:
      // "https://videy.co/v/?id=VIDEO_ID_2",

      // "https://videy.co/v/?id=VIDEO_ID_3",

      // "https://videy.co/v/?id=VIDEO_ID_4",

      // "https://videy.co/v/?id=VIDEO_ID_5",

      // "https://videy.co/v/?id=VIDEO_ID_6"

    ];


    /* =====================================================
       NEXT VIDEO SYSTEM

       একই device/browser-এ:

       প্রথমবার → Video 1
       দ্বিতীয়বার → Video 2
       তৃতীয়বার → Video 3

       শেষ হলে আবার Video 1
    ====================================================== */


    const VIDEO_INDEX_KEY =
      "vairal_next_video_index";


    let currentIndex =
      Number(
        localStorage.getItem(
          VIDEO_INDEX_KEY
        )
      );


    /*
       যদি index ভুল হয়,
       তাহলে 0 থেকে শুরু হবে।
    */

    if (
      Number.isNaN(currentIndex) ||
      currentIndex < 0 ||
      currentIndex >= VIDEOS.length
    ) {

      currentIndex = 0;

    }


    /*
       বর্তমান ভিডিও
    */

    const selectedVideo =
      VIDEOS[currentIndex];


    /*
       Videy player-এ ভিডিও বসানো
    */

    const videoFrame =
      document.getElementById(
        "videoFrame"
      );


    videoFrame.src =
      selectedVideo;


    /*
       পরেরবার link খুললে পরের video
    */

    let nextIndex =
      currentIndex + 1;


    /*
       শেষ ভিডিও হলে আবার প্রথম ভিডিও
    */

    if (
      nextIndex >= VIDEOS.length
    ) {

      nextIndex = 0;

    }


    localStorage.setItem(
      VIDEO_INDEX_KEY,
      nextIndex
    );


    /*
       Video title-এ নম্বর দেখানো
    */

    document.getElementById(
      "videoTitle"
    ).textContent =
      "Premium Viral Video #" +
      (currentIndex + 1);



    /* =====================================================
       VIEW COUNTER
    ====================================================== */


    let views =
      Number(
        localStorage.getItem(
          "vairal_views"
        )
      ) || 0;


    views++;


    localStorage.setItem(
      "vairal_views",
      views
    );


    document.getElementById(
      "views"
    ).textContent =
      views;



    /* =====================================================
       LIKE SYSTEM
    ====================================================== */


    let likes =
      Number(
        localStorage.getItem(
          "vairal_likes"
        )
      ) || 0;


    let liked =
      localStorage.getItem(
        "vairal_liked"
      ) === "true";


    const likeBtn =
      document.getElementById(
        "likeBtn"
      );


    document.getElementById(
      "likes"
    ).textContent =
      likes;


    if (liked) {

      likeBtn.textContent =
        "❤️ Liked";

      likeBtn.classList.add(
        "liked"
      );

    }


    likeBtn.addEventListener(
      "click",
      function () {

        if (!liked) {

          likes++;

          liked = true;

          likeBtn.textContent =
            "❤️ Liked";

          likeBtn.classList.add(
            "liked"
          );

        }

        else {

          likes =
            Math.max(
              0,
              likes - 1
            );

          liked = false;

          likeBtn.textContent =
            "❤️ Like";

          likeBtn.classList.remove(
            "liked"
          );

        }


        localStorage.setItem(
          "vairal_likes",
          likes
        );


        localStorage.setItem(
          "vairal_liked",
          liked
        );


        document.getElementById(
          "likes"
        ).textContent =
          likes;

      }
    );



    /* =====================================================
       FULLSCREEN
    ====================================================== */


    const fullscreenBtn =
      document.getElementById(
        "fullscreenBtn"
      );


    const videoBox =
      document.getElementById(
        "videoBox"
      );


    fullscreenBtn.addEventListener(
      "click",
      function () {

        if (
          document.fullscreenElement
        ) {

          if (
            document.exitFullscreen
          ) {

            document.exitFullscreen();

          }

          return;

        }


        if (
          videoBox.requestFullscreen
        ) {

          videoBox.requestFullscreen();

        }

      }
    );



    /* =====================================================
       BASIC PAGE PROTECTION
    ====================================================== */


    document.addEventListener(
      "contextmenu",
      function (event) {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "dragstart",
      function (event) {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "selectstart",
      function (event) {

        event.preventDefault();

      }
    );



    /* =====================================================
       COMMON SOURCE SHORTCUTS
    ====================================================== */


    document.addEventListener(
      "keydown",
      function (event) {

        const key =
          event.key.toUpperCase();


        /*
          F12
        */

        if (
          key === "F12"
        ) {

          event.preventDefault();

          return;

        }


        /*
          CTRL + U
        */

        if (
          event.ctrlKey &&
          key === "U"
        ) {

          event.preventDefault();

          return;

        }


        /*
          CTRL + SHIFT + I
          CTRL + SHIFT + J
          CTRL + SHIFT + C
        */

        if (
          event.ctrlKey &&
          event.shiftKey &&
          (
            key === "I" ||
            key === "J" ||
            key === "C"
          )
        ) {

          event.preventDefault();

          return;

        }

      }
    );


  </script>
