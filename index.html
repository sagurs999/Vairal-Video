<script>

/* ============================================
   SUPABASE
============================================ */

const SUPABASE_URL =
  "https://mshoftgubfbkvynndtnu.supabase.co";

const SUPABASE_BUCKET =
  "Video";

const SUPABASE_KEY =
  "sb_publishable_2L716MuF36gsDT5fGu_k9Q_LzGLqTk0";


/* ============================================
   ELEMENTS
============================================ */

const video =
  document.getElementById("videoPlayer");

const source =
  document.getElementById("videoSource");

const loading =
  document.getElementById("loading");

const title =
  document.getElementById("videoTitle");


/* ============================================
   GET VIDEOS
============================================ */

async function getVideos(){

  const response = await fetch(

    SUPABASE_URL +
    "/storage/v1/object/list/" +
    SUPABASE_BUCKET,

    {
      method:"POST",

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":
          "Bearer " + SUPABASE_KEY,
        "Content-Type":
          "application/json"
      },

      body:JSON.stringify({
        prefix:"",
        limit:1000,
        offset:0
      })
    }
  );


  if(!response.ok){

    throw new Error(
      "Supabase error: " +
      response.status
    );

  }


  const files =
    await response.json();


  return files.filter(
    file =>
      file.name &&
      file.name
        .toLowerCase()
        .endsWith(".mp4")
  );

}


/* ============================================
   SORT
============================================ */

function sortVideos(videos){

  return videos.sort(
    (a,b)=>{

      const aNumber =
        parseInt(
          a.name.match(/\d+/)?.[0] || 0
        );

      const bNumber =
        parseInt(
          b.name.match(/\d+/)?.[0] || 0
        );

      return bNumber-aNumber;

    }
  );

}


/* ============================================
   LOAD VIDEO
============================================ */

async function loadVideo(){

  try{

    loading.style.display =
      "flex";

    video.style.display =
      "none";


    const videos =
      sortVideos(
        await getVideos()
      );


    if(!videos.length){

      throw new Error(
        "No MP4 videos found"
      );

    }


    const KEY =
      "vairal_last_video";


    const last =
      localStorage.getItem(KEY);


    let index = 0;


    if(last){

      const oldIndex =
        videos.findIndex(
          item =>
            item.name === last
        );


      if(oldIndex >= 0){

        index =
          (oldIndex + 1) %
          videos.length;

      }

    }


    const selected =
      videos[index];


    localStorage.setItem(
      KEY,
      selected.name
    );


    const url =
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      SUPABASE_BUCKET +
      "/" +
      encodeURIComponent(
        selected.name
      );


    source.src = url;


    video.load();


    title.textContent =
      selected.name
        .replace(
          /\.mp4$/i,
          ""
        )
        .replace(
          /[-_]/g,
          " "
        );


    video.onloadeddata =
      function(){

        loading.style.display =
          "none";

        video.style.display =
          "block";

      };


    video.onerror =
      function(){

        loading.innerHTML =
          "⚠️ VIDEO FAILED TO LOAD";

      };


  }catch(error){

    console.error(error);

    loading.innerHTML =
      "⚠️ VIDEO FAILED TO LOAD";

  }

}


loadVideo();



/* ============================================
   VIEWS
============================================ */

let views =
  Number(
    localStorage.getItem(
      "vairal_views"
    )
  ) || 0;

views++;

localStorage.setItem(
  "vairal_views",
  views
);

document.getElementById(
  "views"
).textContent = views;



/* ============================================
   LIKE
============================================ */

let likes =
  Number(
    localStorage.getItem(
      "vairal_likes"
    )
  ) || 0;

let liked =
  localStorage.getItem(
    "vairal_liked"
  ) === "true";


const likeButton =
  document.getElementById(
    "likeButton"
  );


document.getElementById(
  "likes"
).textContent = likes;


if(liked){

  likeButton.classList.add(
    "active"
  );

  likeButton.textContent =
    "❤️ Liked";

}


likeButton.addEventListener(
  "click",
  function(){

    if(!liked){

      likes++;
      liked=true;

      likeButton.classList.add(
        "active"
      );

      likeButton.textContent =
        "❤️ Liked";

    }else{

      likes =
        Math.max(
          0,
          likes-1
        );

      liked=false;

      likeButton.classList.remove(
        "active"
      );

      likeButton.textContent =
        "❤️ Like";

    }


    localStorage.setItem(
      "vairal_likes",
      likes
    );

    localStorage.setItem(
      "vairal_liked",
      liked
    );


    document.getElementById(
      "likes"
    ).textContent = likes;

  }
);

</script>
