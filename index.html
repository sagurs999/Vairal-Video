    * {

    body {

    /* =========================
       HEADER
    ========================== */

    header {

      background:

    .logo {

      font-size: 22px;

      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #ff1590,
          #8c5cff
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color: transparent;

    }


    .telegram {

      display: inline-block;

      text-decoration: none;

      color: #ffffff;

      background:

      padding:

        15px;

      font-size: 14px;

      font-weight: 700;

    }


    /* =========================
       MAIN
    ========================== */

    main {

      max-width: 950px;

      margin: auto;

      padding:
        20px
        12px
        50px;

    }


    /* =========================
       AD AREA
    ========================== */

    .ad-area {

      width: 100%;

      min-height: 80px;

      margin:
        10px
        0
        20px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      border-radius: 12px;

    }


    /* =========================
       TITLE
    ========================== */

    .title {

      font-size:
        clamp(
          24px,
          5vw,
          38px
        );

      font-weight: 900;

      line-height: 1.15;

      margin-bottom: 10px;

    }


    .meta {

      color: #999999;

      font-size: 14px;

      margin-bottom: 15px;

    }


    /* =========================
       VIDEO PLAYER
    ========================== */

    .video-box {

      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000000;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.65);

    }


    #videoPlayer {

      width: 100%;

      height: 100%;

      display: block;

      background: #000000;

      object-fit: contain;

    }


    /* =========================
       BUTTONS
    ========================== */

    .buttons {

      display: flex;

      gap: 10px;

      margin-top: 14px;

    }


    .control-btn {

      border: 0;

      color: #ffffff;

      background:
        rgba(255,255,255,.08);

      padding:
        11px
        16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;

      transition:
        .2s;

    }


    .control-btn:hover {

      background:
        rgba(255,255,255,.17);

    }


    .control-btn:active {

      transform:
        scale(.96);

    }


    .liked {

      background:
        linear-gradient(
          135deg,
          #ff1590,
          #8c5cff
        );

    }


    /* =========================
       DESCRIPTION
    ========================== */

    .description {

      margin-top: 20px;

      padding: 18px;

      border-radius: 15px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid
        rgba(255,255,255,.08);

      color: #aaaaaa;

      line-height: 1.6;

    }


    /* =========================
       FOOTER
    ========================== */

    footer {

      text-align: center;

      color: #555555;

      padding:
        30px
        10px;

      font-size: 12px;

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .logo {

        font-size: 19px;

      }


      .telegram {

        padding:
          9px
          12px;

        font-size: 12px;

      }


      main {

        padding:
          15px
          8px
          40px;

      }


      .video-box {

        border-radius: 12px;

      }

    }

  </style>
