<style>

<body>

<header>

    <div class="logo">
        VAIRAL <span>VIDEO</span>
    </div>

    <a
        class="telegram-btn"
        href="https://t.me/allvairallinkandvideo"

                id="likeBtn"

    <!-- NEXT VIDEO -->

        id="nextBtn"

        style="display:none;">
        ▶ Next Video
    </button>


    <!-- AD #3 -->
    <div class="ad-box">

        <script
            async
            data-cfasync="false"

        <div
            id="container-12b187a99414c09ca49488896ff8e0ac">
        </div>

    </div>

</div>


<div class="footer">
    © 2026 Vairal Video
</div>


<script>

/* =========================================================
   APPWRITE CONFIG
   ========================================================= */

const APPWRITE_ENDPOINT =
    "https://fra.cloud.appwrite.io/v1";

const APPWRITE_PROJECT_ID =
    "6a953702002468f915bf";

const APPWRITE_BUCKET_ID =
    "6a953982002211c0c710";


/* =========================================================
   ELEMENTS
   ========================================================= */

const videoPlayer =
    document.getElementById("videoPlayer");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const videoName =
    document.getElementById("videoName");

const nextBtn =
    document.getElementById("nextBtn");

const likeBtn =
    document.getElementById("likeBtn");

const likeCount =
    document.getElementById("likeCount");

const viewCount =
    document.getElementById("viewCount");


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

const LAST_VIDEO_KEY =
    "vairal_last_video";

const VIEW_PREFIX =
    "vairal_view_";

const LIKE_PREFIX =
    "vairal_like_";


/* =========================================================
   GLOBAL
   ========================================================= */

let videos = [];

let currentIndex = 0;


/* =========================================================
   APPWRITE LIST FILES
   ========================================================= */

async function getAllVideos(){

    try{

        loading.style.display = "block";

        loading.innerHTML =
            "⏳ Loading videos from server...";

        errorBox.style.display = "none";


        /*
         * Appwrite List Files
         */

        const url =
            APPWRITE_ENDPOINT +
            "/storage/buckets/" +
            APPWRITE_BUCKET_ID +
            "/files?limit=100";

        console.log("APPWRITE LIST URL:", url);


        const response = await fetch(url, {

            method: "GET",

            headers: {
                "X-Appwrite-Project":
                    APPWRITE_PROJECT_ID
            }

        });


        console.log(
            "APPWRITE STATUS:",
            response.status
        );


        if(!response.ok){

            let message =
                "Appwrite error: " +
                response.status;

            try{

                const data =
                    await response.json();

                console.error(
                    "APPWRITE ERROR:",
                    data
                );

                if(data.message){
                    message +=
                        " - " +
                        data.message;
                }

            }catch(e){}

            throw new Error(message);
        }


        const data =
            await response.json();


        console.log(
            "APPWRITE FILES:",
            data
        );


        /*
         * Filter video files
         */

        videos =
            (data.files || []).filter(file => {

                const name =
                    String(file.name || "")
                    .toLowerCase();

                const mime =
                    String(file.mimeType || "")
                    .toLowerCase();

                return (
                    name.endsWith(".mp4") ||
                    name.endsWith(".webm") ||
                    name.endsWith(".mov") ||
                    mime.startsWith("video/")
                );

            });


        console.log(
            "VIDEO FILES FOUND:",
            videos.length
        );


        if(videos.length === 0){

            throw new Error(
                "কোনো ভিডিও পাওয়া যায়নি। " +
                "Appwrite Bucket-এ ভিডিও আছে কিনা " +
                "এবং Read Permission = Any কিনা দেখুন।"
            );
        }


        /*
         * Sort videos
         *
         * Example:
         * 100.mp4
         * 99.mp4
         * 98.mp4
         */

        videos.sort((a,b) => {

            const getNumber = file => {

                const match =
                    String(file.name)
                    .match(/\d+/);

                return match
                    ? parseInt(match[0],10)
                    : 0;
            };

            return (
                getNumber(b) -
                getNumber(a)
            );

        });


        console.log(
            "SORTED VIDEOS:",
            videos
        );


        /*
         * Find previous video
         */

        const lastVideo =
            localStorage.getItem(
                LAST_VIDEO_KEY
            );


        if(lastVideo){

            const index =
                videos.findIndex(
                    file =>
                        file.$id === lastVideo
                );


            if(index >= 0){

                /*
                 * Start with next video
                 */

                currentIndex =
                    (index + 1) %
                    videos.length;

            }else{

                currentIndex = 0;

            }

        }else{

            currentIndex = 0;

        }


        loadVideo(currentIndex);

    }catch(error){

        console.error(
            "VIDEO LOAD ERROR:",
            error
        );

        loading.style.display =
            "none";

        videoPlayer.style.display =
            "none";

        errorBox.style.display =
            "block";

        errorBox.innerHTML =
            "❌ ভিডিও লোড করা যাচ্ছে না।<br><br>" +
            "<small>" +
            error.message +
            "</small><br><br>" +
            "Appwrite Bucket-এর Read Permission চেক করুন।";

    }

}


/* =========================================================
   CREATE VIDEO URL
   ========================================================= */

function getVideoUrl(fileId){

    return (
        APPWRITE_ENDPOINT +
        "/storage/buckets/" +
        APPWRITE_BUCKET_ID +
        "/files/" +
        encodeURIComponent(fileId) +
        "/view?project=" +
        encodeURIComponent(APPWRITE_PROJECT_ID)
    );

}


/* =========================================================
   LOAD VIDEO
   ========================================================= */

function loadVideo(index){

    if(!videos.length){
        return;
    }


    /*
     * Loop index
     */

    if(index >= videos.length){
        index = 0;
    }

    if(index < 0){
        index = videos.length - 1;
    }


    currentIndex = index;


    const file =
        videos[currentIndex];


    console.log(
        "SELECTED VIDEO:",
        file
    );


    /*
     * Save current video
     */

    localStorage.setItem(
        LAST_VIDEO_KEY,
        file.$id
    );


    /*
     * Video URL
     */

    const videoUrl =
        getVideoUrl(file.$id);


    console.log(
        "VIDEO URL:",
        videoUrl
    );


    /*
     * UI
     */

    loading.style.display =
        "block";

    loading.innerHTML =
        "⏳ Loading video...";

    errorBox.style.display =
        "none";

    videoPlayer.style.display =
        "none";

    nextBtn.style.display =
        "block";


    videoName.textContent =
        file.name || "Video";


    /*
     * View counter
     */

    updateViewCount(file.$id);


    /*
     * Like counter
     */

    updateLikeCount(file.$id);


    /*
     * Reset old video
     */

    videoPlayer.pause();

    videoPlayer.removeAttribute("src");

    videoPlayer.load();


    /*
     * Set Appwrite video
     */

    videoPlayer.src =
        videoUrl;


    videoPlayer.load();

}


/* =========================================================
   VIDEO CAN PLAY
   ========================================================= */

videoPlayer.addEventListener(
    "loadeddata",
    function(){

        loading.style.display =
            "none";

        videoPlayer.style.display =
            "block";

        errorBox.style.display =
            "none";

    }
);


/* =========================================================
   VIDEO ERROR
   ========================================================= */

videoPlayer.addEventListener(
    "error",
    function(){

        console.error(
            "HTML VIDEO ERROR:",
            videoPlayer.error
        );


        loading.style.display =
            "none";

        videoPlayer.style.display =
            "none";

        errorBox.style.display =
            "block";

        errorBox.innerHTML =
            "❌ এই ভিডিওটি চালানো যাচ্ছে না।<br><br>" +
            "Appwrite File-এর Read Permission এবং ভিডিও ফাইলটি MP4 কিনা চেক করুন।";

    }
);


/* =========================================================
   AUTO NEXT VIDEO
   ========================================================= */

videoPlayer.addEventListener(
    "ended",
    function(){

        console.log(
            "VIDEO ENDED → NEXT VIDEO"
        );


        const nextIndex =
            (currentIndex + 1) %
            videos.length;


        loadVideo(nextIndex);

    }
);


/* =========================================================
   NEXT BUTTON
   ========================================================= */

nextBtn.addEventListener(
    "click",
    function(){

        const nextIndex =
            (currentIndex + 1) %
            videos.length;

        loadVideo(nextIndex);

    }
);


/* =========================================================
   VIEW COUNTER
   ========================================================= */

function updateViewCount(fileId){

    const key =
        VIEW_PREFIX + fileId;


    let count =
        parseInt(
            localStorage.getItem(key) || "0",
            10
        );


    /*
     * Count once per browser
     */

    const viewedKey =
        key + "_done";


    if(!localStorage.getItem(viewedKey)){

        count++;

        localStorage.setItem(
            key,
            count
        );

        localStorage.setItem(
            viewedKey,
            "1"
        );

    }


    viewCount.textContent =
        count;

}


/* =========================================================
   LIKE COUNTER
   ========================================================= */

function updateLikeCount(fileId){

    const key =
        LIKE_PREFIX + fileId;


    const count =
        parseInt(
            localStorage.getItem(key) || "0",
            10
        );


    likeCount.textContent =
        count;


    const likedKey =
        key + "_clicked";


    if(
        localStorage.getItem(
            likedKey
        )
    ){

        likeBtn.classList.add(
            "liked"
        );

    }else{

        likeBtn.classList.remove(
            "liked"
        );

    }

}


/* =========================================================
   LIKE BUTTON
   ========================================================= */

likeBtn.addEventListener(
    "click",
    function(){

        if(!videos.length){
            return;
        }


        const file =
            videos[currentIndex];


        const key =
            LIKE_PREFIX +
            file.$id;


        const likedKey =
            key + "_clicked";


        let count =
            parseInt(
                localStorage.getItem(key) || "0",
                10
            );


        /*
         * Unlike
         */

        if(
            localStorage.getItem(
                likedKey
            )
        ){

            count =
                Math.max(
                    0,
                    count - 1
                );

            localStorage.removeItem(
                likedKey
            );


        }else{

            /*
             * Like
             */

            count++;

            localStorage.setItem(
                likedKey,
                "1"
            );

        }


        localStorage.setItem(
            key,
            count
        );


        updateLikeCount(
            file.$id
        );

    }
);


/* =========================================================
   START
   ========================================================= */

getAllVideos();

</script>

</body>
</html>
