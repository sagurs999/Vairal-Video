body{

.container{

/* HEADER */
.header{

    padding:20px 10px;
}

.logo{
    font-size:30px;

.telegram{

    background:linear-gradient(90deg,#0088cc,#00c6ff);
    color:#fff;
    text-decoration:none;
    font-weight:bold;

/* AD */
.ad{
    width:100%;
    min-height:90px;
    margin:15px 0;
    border-radius:14px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* PLAYER */
.player-box{
    width:100%;
    background:#000;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    min-height:250px;
}

#videoFrame{
    width:100%;
    height:500px;
    border:0;
    display:block;
    background:#000;
}

.loading{
    padding:40px 20px;
    text-align:center;
    color:#aaa;
}

.error{
    padding:40px 20px;
    text-align:center;
    color:#ff4444;
}

/* INFO */
.video-info{
    padding:18px 5px;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
    word-break:break-word;
}

.stats{
    display:flex;
    gap:20px;
    color:#aaa;
    font-size:14px;
}

/* NEXT */
.next-btn{
    width:100%;
    border:0;
    padding:15px;
    margin:10px 0 20px;
    border-radius:12px;
    background:linear-gradient(90deg,#ff0000,#ff4141);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.next-btn:active{
    transform:scale(.98);
}

/* PLAYLIST */
.playlist-title{
    font-size:20px;
    font-weight:bold;
    margin:20px 0 12px;
}

.playlist{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.video-item{
    display:flex;
    gap:12px;
    background:#111;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
}

.video-item:hover{
    background:#1b1b1b;
}

.video-item.active{
    border:1px solid #ff2222;
}

.thumb{
    width:120px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    background:#222;
}

.item-info{
    flex:1;
    min-width:0;
}

.item-title{
    font-size:14px;
    font-weight:bold;
    line-height:1.4;
    margin-bottom:7px;
}

.item-meta{
    font-size:12px;
    color:#888;
}

/* FOOTER */
.footer{
    text-align:center;
    color:#666;
    padding:30px 10px;
    font-size:13px;
}

/* MOBILE */
@media(max-width:600px){

    .logo{
        font-size:25px;
    }

    #videoFrame{
        height:230px;
    }

    .thumb{
        width:100px;
        height:60px;
    }

    .item-title{
        font-size:13px;
    }
}
</style>

        >
            ✈️ JOIN TELEGRAM
        </a>

    </div>


    <!-- MONETAG AD #1 -->
    <div class="ad">

        <!-- PUT MONETAG AD #1 HERE -->

    </div>


    <!-- VIDEO PLAYER -->
    <div class="player-box">

        <div id="loading" class="loading">
            Loading video...
        </div>

        <iframe

            <span>
                ❤️ <span id="likes">0</span>

    </div>

<script>

/* =========================================================
   API CONFIG
   ========================================================= */

/*
   IMPORTANT:

   এখানে LuluStream API key থাকবে না।

   GitHub Pages → Cloudflare Worker → LuluStream API

   Worker-এর URL এখানে বসাবেন।
*/

const API_BASE =
    "https://YOUR-WORKER.workers.dev";


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let videos = [];
let currentIndex = 0;


/* =========================================================
   DOM
   ========================================================= */

const videoFrame =
    document.getElementById("videoFrame");

const loading =
    document.getElementById("loading");

const videoTitle =
    document.getElementById("videoTitle");

const likes =
    document.getElementById("likes");

const views =
    document.getElementById("views");

const playlist =
    document.getElementById("playlist");

const nextButton =
    document.getElementById("nextButton");


/* =========================================================
   LOAD FILE LIST
   ========================================================= */

async function loadVideos(){

    try{

        loading.style.display = "block";
        loading.textContent = "Loading videos...";

        const response =
            await fetch(
                API_BASE +
                "/api/lulustream/files"
            );

        if(!response.ok){
            throw new Error(
                "File List request failed"
            );
        }

        const data =
            await response.json();

        console.log(
            "LuluStream File List:",
            data
        );

        if(
            !data.result ||
            !Array.isArray(data.result.files)
        ){

            throw new Error(
                "No videos found"
            );
        }

        videos =
            data.result.files.filter(
                video =>
                    video.canplay == 1
            );


        if(videos.length === 0){

            throw new Error(
                "No playable videos found"
            );
        }


        /* newest first */

        videos.sort(
            (a,b) =>
                new Date(b.uploaded) -
                new Date(a.uploaded)
        );


        buildPlaylist();


        /*
           Continue from previous video
        */

        const savedCode =
            localStorage.getItem(
                "vairal_current_video"
            );

        let savedIndex =
            videos.findIndex(
                video =>
                    video.file_code === savedCode
            );

        if(savedIndex < 0){
            savedIndex = 0;
        }

        currentIndex =
            savedIndex;


        await playVideo(currentIndex);

    }
    catch(error){

        console.error(error);

        loading.style.display =
            "block";

        loading.className =
            "error";

        loading.textContent =
            "Unable to load videos.";
    }
}


/* =========================================================
   PLAY VIDEO
   ========================================================= */

async function playVideo(index){

    if(
        index < 0 ||
        index >= videos.length
    ){
        return;
    }


    currentIndex = index;


    const video =
        videos[currentIndex];


    localStorage.setItem(
        "vairal_current_video",
        video.file_code
    );


    videoTitle.textContent =
        video.title || "Vairal Video";


    views.textContent =
        video.views || "0";


    likes.textContent =
        getLikes(video.file_code);


    /*
       First use LuluStream watch link.
       File List provides this link.
    */

    let playerURL =
        video.link;


    /*
       Try File Info as well.
    */

    try{

        const response =
            await fetch(
                API_BASE +
                "/api/lulustream/file-info?file_code=" +
                encodeURIComponent(
                    video.file_code
                )
            );


        if(response.ok){

            const info =
                await response.json();

            console.log(
                "LuluStream File Info:",
                info
            );


            /*
               Search possible playable URL
            */

            const foundURL =
                findPlayableURL(info);

            if(foundURL){
                playerURL =
                    foundURL;
            }

        }

    }
    catch(error){

        console.log(
            "File Info unavailable:",
            error
        );

    }


    if(!playerURL){

        loading.className =
            "error";

        loading.textContent =
            "Video URL not available.";

        return;
    }


    loading.style.display =
        "none";


    videoFrame.style.display =
        "block";


    videoFrame.src =
        playerURL;


    highlightPlaylist();

}


/* =========================================================
   FIND PLAYABLE URL
   ========================================================= */

function findPlayableURL(data){

    const possibleKeys = [

        "hls",
        "hls_url",
        "m3u8",
        "m3u8_url",
        "stream",
        "stream_url",
        "video_url",
        "file_url",
        "embed",
        "embed_url",
        "player",
        "player_url",
        "link",
        "url"

    ];


    function search(object){

        if(!object){
            return null;
        }


        if(typeof object === "string"){

            if(
                object.startsWith("http://") ||
                object.startsWith("https://")
            ){

                return object;
            }

            return null;
        }


        if(Array.isArray(object)){

            for(
                const item of object
            ){

                const result =
                    search(item);

                if(result){
                    return result;
                }

            }

            return null;
        }


        if(typeof object === "object"){

            /*
               Check preferred keys first
            */

            for(
                const key of possibleKeys
            ){

                if(
                    typeof object[key] ===
                    "string"
                ){

                    const value =
                        object[key];

                    if(
                        value.startsWith(
                            "http://"
                        ) ||
                        value.startsWith(
                            "https://"
                        )
                    ){

                        return value;
                    }

                }

            }


            /*
               Search nested objects
            */

            for(
                const key in object
            ){

                const result =
                    search(object[key]);

                if(result){
                    return result;
                }

            }

        }


        return null;
    }


    return search(data);
}


/* =========================================================
   PLAYLIST
   ========================================================= */

function buildPlaylist(){

    playlist.innerHTML = "";


    videos.forEach(
        (video,index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "video-item";


            item.innerHTML = `

                <img
                    class="thumb"
                    src="${
                        video.thumbnail ||
                        ""
                    }"
                    loading="lazy"
                    onerror="
                        this.style.display='none'
                    "
                >

                <div class="item-info">

                    <div class="item-title">
                        ${
                            escapeHTML(
                                video.title ||
                                "Untitled Video"
                            )
                        }
                    </div>

                    <div class="item-meta">

                        👁 ${
                            video.views ||
                            "0"
                        }

                        &nbsp; • &nbsp;

                        ⏱ ${
                            video.length ||
                            "0"
                        } sec

                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                () => {

                    playVideo(index);

                    window.scrollTo({
                        top:0,
                        behavior:"smooth"
                    });

                }
            );


            playlist.appendChild(item);

        }
    );


    highlightPlaylist();
}


/* =========================================================
   ACTIVE PLAYLIST ITEM
   ========================================================= */

function highlightPlaylist(){

    const items =
        playlist.querySelectorAll(
            ".video-item"
        );


    items.forEach(
        (item,index) => {

            item.classList.toggle(
                "active",
                index === currentIndex
            );

        }
    );
}


/* =========================================================
   NEXT VIDEO
   ========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if(videos.length === 0){
            return;
        }


        let nextIndex =
            currentIndex + 1;


        if(
            nextIndex >=
            videos.length
        ){

            nextIndex = 0;

        }


        playVideo(nextIndex);

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =========================================================
   LIKE SYSTEM
   ========================================================= */

function getLikes(fileCode){

    return (
        localStorage.getItem(
            "vairal_like_" +
            fileCode
        ) || "0"
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   START
   ========================================================= */

loadVideos();

</script>
