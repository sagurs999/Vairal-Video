<html lang="en">
<head>

<style>
*{
  box-sizing:border-box;
  margin:0;

body{
  background:#050505;
  color:#fff;

  margin:auto;

  font-size:20px;
  font-weight:bold;
  color:white;
  border-radius:20px;
  background:linear-gradient(90deg,#0088cc,#00c6ff);
}
.ad-top,.ad-bottom{
  background:#111;
  padding:15px;
  border-radius:14px;
  margin-bottom:20px;
  min-height:90px;
  text-align:center;
}
.player-box{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:#000;
  width:100%;
  height:450px;
}
iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.video-info{
  padding:10px 5px;
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}
</style>

<!-- Adsterra Popunder Script -->
<script src="https://pl30923744.profitableratecpmnetwork.com/bc/bf/98/bcbf98c695a71ec20aa923a7a131ffa3.js"></script>

<!-- Adsterra Social Bar Script -->
<script src="https://pl30923746.profitableratecpmnetwork.com/60/5e/6e/605e6e402e2188c01fb7fcc993d62be2.js"></script>
</head>
<body>

<div class="container">
  <!-- টেলিগ্রাম লিংক (যাতে ক্লিক করলেই নতুন ভিডিও আসবে এবং টেলিগ্রামেও রিডাইরেক্ট হবে) -->
  <a id="telegramBtn" class="telegram" href="https://t.me/hotvideo457" target="_blank" rel="noopener">
    ✈️ JOIN TELEGRAM CHANNEL
  </a>

  <!-- টপ অ্যাড (Native Banner) -->
  <div class="ad-top">
    <script async="async" data-cfasync="false" src="https://pl30923747.profitableratecpmnetwork.com/12b187a99414c09ca49488896ff8e0ac/invoke.js"></script>
    <div id="container-12b187a99414c09ca49488896ff8e0ac"></div>
  </div>

  <!-- ভিডিও টাইটেল -->
  <div class="video-info" id="videoTitle">Loading Video...</div>
  
  <!-- ভিডিও প্লেয়ার (Iframe) -->
  <div class="player-box">
    <iframe id="videoFrame" src="" allowfullscreen scrolling="no"></iframe>
  </div>

  <!-- নিচের অ্যাড সেশন -->
  <div class="ad-bottom" style="margin-top:20px;">
    <!-- চাইলে এখানে অন্য কোনো ব্যানার অ্যাড বসাতে পারেন -->
  </div>
</div>

<script>
/* ভিডিও লিস্ট (এখানে আপনার ভিডিওগুলোর লিংক এবং টাইটেল বসাবেন) */
const videoList = [
  {
    title: "Vairal Video Part 1",
    url: "https://playmogo.com/e/0vascqz7njes"
  },
  {
    title: "Vairal Video Part 2",
    url: "https://playmogo.com/e/0vascqz7njes" // প্রয়োজনে এই লিংক পরিবর্তন করে নতুন ভিডিও লিংক দিতে পারেন
  }
];

// ব্রাউজারের লজিক হ্যান্ডেল করার জন্য লোকালস্টোরেজ ব্যবহার
let currentIndex = parseInt(localStorage.getItem("vairal_index")) || 0;

if (currentIndex >= videoList.length) {
  currentIndex = 0;
}

const videoFrame = document.getElementById("videoFrame");
const videoTitle = document.getElementById("videoTitle");
const telegramBtn = document.getElementById("telegramBtn");

// কারেন্ট ভিডিও সেট করা
function loadCurrentVideo() {
  const currentVideo = videoList[currentIndex];
  videoTitle.textContent = currentVideo.title;
  videoFrame.src = currentVideo.url;
}

loadCurrentVideo();

// টেলিগ্রাম লিংকে ক্লিক করলে পরবর্তী ভিডিওর ইনডেক্স সেভ হবে এবং টেলিগ্রামেও ওপেন হবে
telegramBtn.addEventListener("click", function () {
  let nextIndex = currentIndex + 1;
  if (nextIndex >= videoList.length) {
    nextIndex = 0;
  }
  localStorage.setItem("vairal_index", nextIndex);
});
</script>

</body>
</html>
