  <script>

    /* ====================================================
       SUPABASE CONFIGURATION
    ==================================================== */

    const SUPABASE_URL =
      "https://mshoftgubfbkvynndtnu.supabase.co";


    const SUPABASE_BUCKET =
      "Video";


    const SUPABASE_KEY =
      "sb_publishable_2L716MuF36gsDT5fGu_k9Q_LzGLqTk0";



    /* ====================================================
       ELEMENTS
    ==================================================== */

    const videoPlayer =
      document.getElementById(
        "videoPlayer"
      );


    const videoSource =
      document.getElementById(
        "videoSource"
      );


    const videoStatus =
      document.getElementById(
        "videoStatus"
      );


    const videoTitle =
      document.getElementById(
        "videoTitle"
      );



    /* ====================================================
       GET VIDEO FILES FROM SUPABASE
    ==================================================== */

    async function getVideos() {

      const url =
        SUPABASE_URL +
        "/storage/v1/object/list/" +
        SUPABASE_BUCKET;


      const response =
        await fetch(
          url,
          {
            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              prefix: "",

              limit: 1000,

              offset: 0

            })

          }
        );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(
          "Supabase Storage error " +
          response.status +
          ": " +
          error
        );

      }


      const files =
        await response.json();


      return files.filter(
        function(file) {

          return (
            file.name &&
            file.name
              .toLowerCase()
              .endsWith(".mp4")
          );

        }
      );

    }



    /* ====================================================
       SORT VIDEOS BY NUMBER

       video-10
       video-9
       video-8
       ...
    ==================================================== */

    function sortVideos(videos) {

      return videos.sort(
        function(a, b) {

          const aMatch =
            a.name.match(/\d+/);

          const bMatch =
            b.name.match(/\d+/);


          const aNumber =
            aMatch
              ? parseInt(
                  aMatch[0],
                  10
                )
              : 0;


          const bNumber =
            bMatch
              ? parseInt(
                  bMatch[0],
                  10
                )
              : 0;


          return (
            bNumber -
            aNumber
          );

        }
      );

    }



    /* ====================================================
       LOAD CURRENT VIDEO
    ==================================================== */

    async function loadVideo() {

      try {

        videoStatus.style.display =
          "flex";

        videoStatus.textContent =
          "ভিডিও লোড হচ্ছে...";


        videoPlayer.style.display =
          "none";


        /* Supabase থেকে সব MP4 */

        let videos =
          await getVideos();


        if (!videos.length) {

          throw new Error(
            "Video bucket-এ কোনো MP4 পাওয়া যায়নি।"
          );

        }


        /* Number অনুযায়ী sort */

        videos =
          sortVideos(videos);


        console.log(
          "Supabase videos:",
          videos
        );


        /* =================================================
           VIDEO SEQUENCE

           নতুন visitor:
           video-10 → video-9 → video-8 ...

           নতুন video upload হলে সেটিও
           automatically list-এ আসবে।
        ================================================= */


        const STORAGE_KEY =
          "vairal_current_video_name";


        const lastVideo =
          localStorage.getItem(
            STORAGE_KEY
          );


        let index = 0;


        if (lastVideo) {

          const lastIndex =
            videos.findIndex(
              function(video) {

                return (
                  video.name ===
                  lastVideo
                );

              }
            );


          if (lastIndex >= 0) {

            index =
              (
                lastIndex + 1
              ) %
              videos.length;

          }

        }


        const selectedVideo =
          videos[index];


        /* বর্তমান ভিডিও save */

        localStorage.setItem(
          STORAGE_KEY,
          selectedVideo.name
        );


        /* =================================================
           PUBLIC VIDEO URL
        ================================================= */

        const videoURL =
          SUPABASE_URL +
          "/storage/v1/object/public/" +
          SUPABASE_BUCKET +
          "/" +
          encodeURIComponent(
            selectedVideo.name
          );


        console.log(
          "Playing:",
          selectedVideo.name
        );


        /* =================================================
           SET VIDEO
        ================================================= */

        videoSource.src =
          videoURL;


        videoPlayer.load();


        videoPlayer.style.display =
          "block";


        videoStatus.style.display =
          "none";


        /* =================================================
           TITLE
        ================================================= */

        videoTitle.textContent =
          selectedVideo.name
            .replace(
              /\.mp4$/i,
              ""
            )
            .replace(
              /[-_]/g,
              " "
            );


      }

      catch (error) {

        console.error(
          "VIDEO ERROR:",
          error
        );


        videoPlayer.style.display =
          "none";


        videoStatus.style.display =
          "flex";


        videoStatus.innerHTML =
          "⚠️ ভিডিও লোড করা যাচ্ছে না।<br><br>" +
          "Supabase Storage permission অথবা API key পরীক্ষা করুন।";

      }

    }



    /* ====================================================
       START VIDEO
    ==================================================== */

    loadVideo();



    /* ====================================================
       VIEW COUNTER
    ==================================================== */

    let views =
      Number(
        localStorage.getItem(
          "vairal_views"
        )
      ) || 0;


    views++;


    localStorage.setItem(
      "vairal_views",
      views
    );


    document.getElementById(
      "views"
    ).textContent =
      views;



    /* ====================================================
       LIKE SYSTEM
    ==================================================== */

    let likes =
      Number(
        localStorage.getItem(
          "vairal_likes"
        )
      ) || 0;


    let liked =
      localStorage.getItem(
        "vairal_liked"
      ) === "true";


    const likeButton =
      document.getElementById(
        "likeButton"
      );


    document.getElementById(
      "likes"
    ).textContent =
      likes;


    if (liked) {

      likeButton.classList.add(
        "active"
      );

      likeButton.textContent =
        "❤️ Liked";

    }


    likeButton.addEventListener(
      "click",
      function() {

        if (!liked) {

          likes++;

          liked = true;


          likeButton.classList.add(
            "active"
          );


          likeButton.textContent =
            "❤️ Liked";

        }

        else {

          likes =
            Math.max(
              0,
              likes - 1
            );

          liked = false;


          likeButton.classList.remove(
            "active"
          );


          likeButton.textContent =
            "❤️ Like";

        }


        localStorage.setItem(
          "vairal_likes",
          likes
        );


        localStorage.setItem(
          "vairal_liked",
          liked
        );


        document.getElementById(
          "likes"
        ).textContent =
          likes;

      }

    );


  </script>
